<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Truth They Never Told You — Asjid Rouf</title>
<style>
:root{--bg:#050505;--fg:#eee;--ln:#333;--acc:#c01212;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;overflow:hidden}
#bk{position:relative;height:calc(100% - 54px);perspective:1500px;touch-action:pan-y;overflow:hidden;user-select:none;-webkit-user-select:none}
.pgs{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;opacity:0;visibility:hidden;transform:translateX(16%) rotateY(-12deg);transform-origin:left center;transition:transform .6s cubic-bezier(.2,.7,.2,1),opacity .45s,visibility 0s .6s}
.pgs.l{transform:translateX(-16%) rotateY(12deg);transform-origin:right center}
.pgs.on{opacity:1;visibility:visible;transform:none;transition:transform .6s cubic-bezier(.2,.7,.2,1),opacity .45s,visibility 0s}
.pgs img{max-width:100%;max-height:100%;width:auto;height:auto;object-fit:contain;box-shadow:0 0 30px rgba(0,0,0,.6);-webkit-user-drag:none}
#nv{position:fixed;left:0;right:0;bottom:env(safe-area-inset-bottom,0px);height:54px;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:0 12px;background:var(--bg);border-top:1px solid var(--ln);box-sizing:border-box}
#nv button,#nv a{background:none;border:1px solid var(--ln);color:var(--fg);height:38px;border-radius:19px;font-size:14px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;text-decoration:none;box-sizing:border-box}
#nv button{width:44px;font-size:20px}
#nv a{padding:0 16px;border-color:var(--acc)}
#nv :focus-visible{outline:2px solid var(--acc)}
#ct{font-size:13px;letter-spacing:.12em;color:#999;min-width:58px;text-align:center}
#pg{position:fixed;left:0;bottom:calc(54px + env(safe-area-inset-bottom,0px));height:2px;background:var(--acc);transition:width .5s}
@media(prefers-reduced-motion:reduce){.pgs,.pgs.on{transition:opacity .2s}}
</style></head><body>
<div id="bk"></div><div id="pg"></div>
<nav id="nv"><button id="pv" aria-label="Previous page">‹</button><a href="The_Truth_They_Never_Told_You.pdf" download>Download PDF</a><span id="ct"></span><button id="nx" aria-label="Next page">›</button></nav>
<script>
(function(){
var P=["pages/p-01.jpg", "pages/p-02.jpg", "pages/p-03.jpg", "pages/p-04.jpg", "pages/p-05.jpg", "pages/p-06.jpg", "pages/p-07.jpg", "pages/p-08.jpg", "pages/p-09.jpg", "pages/p-10.jpg", "pages/p-11.jpg", "pages/p-12.jpg", "pages/p-13.jpg", "pages/p-14.jpg", "pages/p-15.jpg", "pages/p-16.jpg", "pages/p-17.jpg", "pages/p-18.jpg", "pages/p-19.jpg", "pages/p-20.jpg", "pages/p-21.jpg", "pages/p-22.jpg", "pages/p-23.jpg", "pages/p-24.jpg", "pages/p-25.jpg", "pages/p-26.jpg", "pages/p-27.jpg", "pages/p-28.jpg", "pages/p-29.jpg", "pages/p-30.jpg", "pages/p-31.jpg"],bk=document.getElementById('bk'),ct=document.getElementById('ct'),pg=document.getElementById('pg'),c=0,S=[];
P.forEach(function(src,i){var d=document.createElement('div');d.className='pgs';var im=new Image();im.alt='Page '+(i+1);im.draggable=false;d.appendChild(im);bk.appendChild(d);S.push({d:d,im:im,src:src})});
function ld(i){var s=S[i];if(s&&!s.im.getAttribute('src'))s.im.src=s.src}
function go(i){
  if(i<0||i>=S.length)return;c=i;ld(c-1);ld(c);ld(c+1);ld(c+2);
  S.forEach(function(s,k){s.d.classList.toggle('on',k===c);s.d.classList.toggle('l',k<c)});
  ct.textContent=(c+1)+' / '+S.length;pg.style.width=((c+1)/S.length*100)+'%';
  try{localStorage.setItem('ttntp-img',c)}catch(e){}
}
function nx(){go(c+1)}function pv(){go(c-1)}
document.getElementById('nx').onclick=nx;document.getElementById('pv').onclick=pv;
document.addEventListener('keydown',function(e){
  if(e.key==='ArrowRight'||e.key===' '||e.key==='PageDown')nx();
  if(e.key==='ArrowLeft'||e.key==='PageUp')pv();
});
var x0,y0;
bk.addEventListener('touchstart',function(e){if(e.touches.length>1){x0=null;return}x0=e.touches[0].clientX;y0=e.touches[0].clientY},{passive:true});
bk.addEventListener('touchend',function(e){
  if(x0==null)return;
  var dx=e.changedTouches[0].clientX-x0,dy=e.changedTouches[0].clientY-y0;
  if(Math.abs(dx)>50&&Math.abs(dx)>Math.abs(dy)*1.3){dx<0?nx():pv()}
},{passive:true});
bk.addEventListener('click',function(e){var w=bk.clientWidth;if(e.clientX>w*.75)nx();else if(e.clientX<w*.25)pv()});
var st=0;try{st=parseInt(localStorage.getItem('ttntp-img'))||0}catch(e){}
go(st);
})();
</script></body></html>
