const TX=[
[0,5,[
`It was one of those nights when the world seemed unusually quiet.`,
`The streets were still alive. Cars passed beneath the streetlights, windows glowed in distant buildings, and somewhere, someone was probably celebrating a success that another person was desperately praying for.`,
`But I was sitting alone, thinking.`,
`Not about money. Not about success. Not even about the future.`,
`I was thinking about life itself.`,
`At some point, every person begins to question the things they once believed without hesitation. The promises they made to themselves. The people they trusted. The dreams they thought would make everything better.`,
`When we are young, we imagine life as a straight road. We believe that if we study hard enough, work hard enough, remain honest enough, and treat people well enough, everything will eventually fall into place.`,
`Nobody tells us how complicated that belief can become.`,
`You can do everything right and still lose something you desperately wanted. You can give someone your sincerest intentions and still become a stranger in their story. You can spend years building something, only to discover that reaching it does not necessarily make you happy.`,
`And perhaps that is where real thinking begins.`,
`Not when you find all the answers, but when you finally become brave enough to question the answers you were given.`,
`I used to think growing up meant becoming certain about everything.`]],
[0,6,[
`Now I think it means becoming comfortable with the fact that some things will never make complete sense.`,
`Maybe life was never supposed to be understood all at once.`,
`Maybe we were simply supposed to pay attention while we were living it.`]],
[1,8,[
`There is something strange about being human.`,
`We spend a considerable part of our lives trying to be understood by people who have never experienced our circumstances.`,
`We explain our decisions. We defend our silence. We try to make others understand why certain things matter to us.`,
`Yet everyone looks at the world through a different history.`,
`A person who has never experienced loneliness may misunderstand someone who enjoys being alone. Someone who has always had opportunities may judge the hesitation of someone who has spent years fighting for one.`,
`People rarely see the complete person standing in front of them. They see fragments: a reaction, a decision, a photograph, a success, a mistake.`,
`And then they create a story around those fragments.`,
`The uncomfortable truth is that sometimes their story about you becomes more important to them than the person you actually are.`,
`But you cannot spend your entire life correcting every misunderstanding.`,
`There will always be someone who thinks you have changed when you have simply grown. Someone who calls you arrogant when you have finally learned to establish boundaries. Someone who considers your silence weakness because they have never understood the strength required to remain quiet.`]],
[1,9,[
`This does not mean every criticism is wrong. Sometimes people see things in us that we refuse to acknowledge. There is value in listening, even when listening hurts.`,
`But there is a difference between accepting useful criticism and allowing strangers to become the authors of your identity.`,
`You must learn to examine yourself without constantly asking the world for permission.`,
`Because the person who lives with the consequences of your decisions is not the person watching you from a distance.`,
`It is you.`]],
[2,11,[
`One of the most exhausting things a human being can do is measure an entire life against selected moments from somebody else’s.`,
`We see someone purchasing a house and forget the years of uncertainty that may have preceded it. We see someone travelling across countries and imagine that their life must be extraordinary. We see a successful business, a beautiful relationship, a perfect photograph, and quietly begin questioning our own progress.`,
`The problem is not that other people are succeeding.`,
`The problem begins when their success becomes evidence, in our minds, that we are failing.`,
`There was a time when people mostly compared themselves with those they knew personally. Today, a person can wake up and encounter hundreds of carefully selected lives before even getting out of bed.`,
`But a photograph is not a biography.`,
`A successful moment is not an entire existence. A smiling face does not provide a complete account of someone’s private struggles.`,
`Psychological research describes this tendency as social comparison: the process of evaluating ourselves in relation to other people. Research on social media suggests that its effects are not identical for everyone; context, individual differences and the way platforms are used all matter.`,
`Still, one question deserves our attention:`,
`>Why do we allow someone else’s timeline to make us feel late in our own life?`]],
[2,12,[
`A tree does not grow faster because another tree has already produced fruit.`,
`Some people discover their direction early. Others spend years searching. Some build their lives quietly, without an audience, recognition or applause.`,
`None of these journeys automatically makes one person more valuable than another.`,
`Perhaps maturity begins when you can genuinely appreciate another person’s progress without treating it as a personal defeat.`,
`Your life is not a competition with people whose circumstances you barely understand.`,
`You have your own road to walk.`,
`And it deserves your attention.`]],
[3,14,[
`One of the hardest experiences in life is discovering that someone you remember is not necessarily the person they are today.`,
`We often become attached not only to people, but to versions of them. We remember how they spoke to us, how they made ordinary days feel special, and how naturally they once occupied a place in our lives.`,
`Then something changes.`,
`Sometimes it happens through betrayal. Sometimes through distance. Sometimes through a disagreement that never gets resolved. And sometimes nothing dramatic happens at all.`,
`Two people simply grow in different directions.`,
`The difficult part is accepting that history and the present are not the same thing.`,
`You may remember someone’s kindness, but that does not guarantee they will continue treating you kindly. You may remember a friendship as one of the most meaningful parts of your life, but that does not mean it must last forever.`,
`We sometimes hold on because letting go feels like admitting that something beautiful has ended.`,
`But an ending does not erase the reality of what once existed.`,
`Not every person who leaves your life was pretending. Not every relationship that ends was a mistake. And not every distance needs to be filled with resentment.`]],
[3,15,[
`Some people teach us through their presence. Others teach us through their absence.`,
`The important thing is not to become so disappointed by a few experiences that you lose your ability to trust anyone.`,
`Wisdom is not becoming emotionally unavailable.`,
`It is learning to remain kind without abandoning your self-respect.`,
`You can miss someone and still understand why they are no longer part of your life.`,
`You can forgive someone without inviting them back into the same position.`,
`And you can appreciate the past without demanding that it return.`]],
[4,17,[
`There is an old philosophical idea that has survived centuries because it addresses a problem almost everyone encounters.`,
`The Stoic philosopher Epictetus taught a distinction between things that are within our control and things that are not.`,
`Our intentions, judgments and choices belong to one category. Other people’s opinions, unexpected events and the final outcomes of many situations belong to another.`,
`It sounds simple.`,
`Living by it is not.`,
`We want people to understand us. We want our efforts to produce results. We want the future to follow the plans we have carefully constructed.`,
`But life does not negotiate with our expectations.`,
`You can prepare for an opportunity and still not receive it. You can love someone and still not control their decisions. You can work honestly and still encounter unfairness.`,
`This is where many people become exhausted: they spend their energy fighting realities they cannot command.`,
`Acceptance, however, is not surrender.`,
`It does not mean tolerating injustice, abandoning ambition or refusing to improve difficult circumstances.`,
`It means recognizing where your responsibility ends and where uncertainty begins.`]],
[4,18,[
`You are responsible for how carefully you prepare, not for guaranteeing every outcome.`,
`You are responsible for the honesty of your actions, not for controlling every interpretation.`,
`You can influence the direction of your life without possessing complete control over the road.`,
`Perhaps the greatest freedom is not getting everything you want.`,
`Perhaps it is learning that your peace does not have to depend entirely on whether the world cooperates with you.`,
`There are things worth fighting for.`,
`And there are things worth releasing.`,
`Knowing the difference can change the way you live.`]],
[5,20,[
`We are taught to imagine success as a destination.`,
`A certain amount of money. A respected position. A beautiful home. A recognizable name. A life that looks impressive from the outside.`,
`And there is nothing inherently wrong with wanting these things.`,
`Ambition can give direction to our efforts. Financial security can create opportunities. Recognition can reward years of difficult work.`,
`But there is a question we rarely ask before chasing the next achievement:`,
`>What if I reach it and still feel something is missing?`,
`The Austrian psychiatrist Viktor Frankl devoted much of his work to the human search for meaning. His experiences during the Holocaust deeply shaped his thinking, although his ideas about meaning had begun developing before that period.`,
`His work reminds us of a distinction that modern ambition sometimes overlooks: having something to achieve is not necessarily the same as having a reason to live.`,
`Meaning can be found in meaningful work, in love, in responsibility, in creating something worthwhile, and in the way we respond to circumstances that cannot be changed.`,
`Consider two people.`,
`One spends years building a business but never finds time for the people who matter.`,
`Another works a modest job, supports a family, develops a skill and quietly contributes something valuable to the lives around them.`]],
[5,21,[
`Which life is more successful?`,
`There is no universal measurement that can answer that question.`,
`Perhaps the mistake is believing that success must look impressive before it can be meaningful.`,
`You do not have to become famous to make your existence matter.`,
`You do not need an audience to justify your efforts.`,
`And you do not have to turn every passion into a business, every friendship into a network, or every quiet moment into an opportunity for productivity.`,
`Build something. Earn money. Chase your ambitions.`,
`But do not become so occupied with constructing a life that you forget to actually experience it.`]],
[6,23,[
`There are parts of personal growth that nobody applauds.`,
`Nobody sees the moment you decide not to repeat an old mistake.`,
`Nobody hears the conversation you have with yourself after a difficult day. Nobody witnesses the small decisions that slowly separate the person you were from the person you are becoming.`,
`We often associate transformation with dramatic events.`,
`A new job. A new city. A new relationship. A sudden success.`,
`But much of who we become is shaped by ordinary moments.`,
`The decision to tell the truth when lying would be easier.`,
`The decision to continue learning when nobody is checking your progress.`,
`The decision to walk away from an argument that has stopped serving any purpose.`,
`The decision to admit that you were wrong.`,
`These moments rarely look extraordinary.`,
`Yet they gradually build character.`,
`There is also something important to remember: becoming a better person does not mean becoming a perfect person.`,
`You will still have days when you doubt yourself. You may return to old habits, misunderstand people, make poor decisions and wish you had handled certain situations differently.`,
`Growth is not a permanent state of confidence.`]],
[6,24,[
`Sometimes it is simply the ability to recognize a mistake sooner than you did before.`,
`Sometimes it is an apology.`,
`Sometimes it is trying again without making promises about how quickly everything will improve.`,
`And sometimes it is sitting alone, acknowledging that you do not have all the answers, and choosing not to give up on yourself.`,
`The world may never notice these changes.`,
`That does not make them insignificant.`,
`Some of the most important things a person builds are invisible to everyone except the person living with them.`]],
[7,26,[
`Perhaps one day you will look back at your life and understand why certain things did not happen the way you expected.`,
`Perhaps you will recognize that some of your greatest lessons arrived disguised as disappointments.`,
`Perhaps you will discover that the people you once tried so hard to impress were never responsible for determining your worth.`,
`But perhaps some questions will remain unanswered.`,
`And that is alright.`,
`There is no guarantee that every painful experience will eventually reveal a beautiful purpose. Some losses are simply losses. Some people will never explain themselves. Some opportunities will never return.`,
`We should not have to invent a happy ending for every difficult chapter just to make life feel meaningful.`,
`There is courage in acknowledging reality without allowing it to destroy your capacity for hope.`,
`If I have learned anything from thinking about people, ambition, relationships and time, it is this:`,
`Life is not only about what you manage to collect before it ends.`,
`It is also about what happens to you while you are collecting it.`,
`Did you become someone you respect?`,
`Did you make time for the people who genuinely mattered?`,
`Did you allow fear to make every important decision?`]],
[7,27,[
`Did you become so concerned with being understood that you stopped trying to understand others?`,
`Did you postpone happiness until a future that was never guaranteed?`,
`These are not questions with identical answers for everyone.`,
`They are questions worth asking.`,
`And perhaps the truth nobody told us is not that life is cruel, that people cannot be trusted, or that happiness is impossible.`,
`Perhaps it is something quieter.`,
`>You can spend your entire life waiting for the world to become the way you imagined it, or you can begin learning how to live honestly in the world that actually exists.`,
`You will not always be ahead.`,
`You will not always be understood.`,
`You will not always get another chance.`,
`But while you are here, you still have choices to make, people to care for, mistakes to correct, and a life that is still unfolding.`,
`Do not spend all of it trying to become someone worth noticing.`,
`Become someone you can live with when nobody is watching.`]],
[7,28,[
`And when the world finally becomes quiet again, I hope you will not feel that you spent your entire life somewhere else.`]]
];

const prev=document.getElementById("prev"),next=document.getElementById("next"),count=document.getElementById("count"),prog=document.getElementById("prog");
prev.onclick=()=>go(cur-1,true);next.onclick=()=>go(cur+1);
st.addEventListener("click",e=>{const li=e.target.closest("[data-ch]");if(li)go(chStart[+li.dataset.ch])});
let vis=false;new IntersectionObserver(e=>vis=e[0].isIntersecting,{threshold:.4}).observe(document.getElementById("book"));
addEventListener("keydown",e=>{if(!vis)return;if(e.key==="ArrowRight")go(cur+1);if(e.key==="ArrowLeft")go(cur-1,true)});
let x0=null;st.addEventListener("touchstart",e=>x0=e.touches[0].clientX,{passive:true});
st.addEventListener("touchend",e=>{if(x0===null)return;const d=e.changedTouches[0].clientX-x0;if(Math.abs(d)>50)d<0?go(cur+1):go(cur-1,true);x0=null});
go(0);
</script>
